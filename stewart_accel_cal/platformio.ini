; PlatformIO Project Configuration File
; BigTreeTech Octopus V1.1 (STM32F446ZET6) - Stewart platform accelerometer
; calibration/validation firmware.
;
; SEPARATE PROJECT from ../octo on purpose: this build's only job is to drive
; known test poses and log what the MMA8451 actually measures at each one, so
; it doesn't carry the orbit ("W") / joint-wave ("J") drive modes that the
; main driving firmware has - keeps this one small and focused, and the two
; firmwares can now evolve independently without fighting over flash space or
; command-set collisions. Flash whichever one you currently need onto the
; same physical Octopus board; they're mutually exclusive at any given time.
;
; Board quirks this config works around (see ../octo/README.md for the full
; writeup - identical board, identical quirks):
;   1. The Octopus uses a 12MHz crystal, not the 8MHz most STM32F4 boards assume.
;   2. STM32Duino ships no linker script for this exact flash/RAM variant, so we
;      supply one (STM32F446ZETx_FLASH.ld).
;   3. The stock "nucleo_f446ze"-family board manifests in some ststm32 platform
;      versions don't list "arduino" as a supported framework, so we supply our
;      own board definition (boards/genericSTM32F446ZE.json) that does.

[env:octopus]
platform = ststm32
board = genericSTM32F446ZE
framework = arduino

; STM32Duino doesn't ship a linker script for this flash/RAM size - use ours.
board_build.ldscript = STM32F446ZETx_FLASH.ld

build_flags =
    -DHSE_VALUE=12000000L
    -DOCTOPUS_BOARD
    -DPIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -Wl,-u,_scanf_float
    ; Shared 'B' (reboot-to-DFU) support - see ../firmware_common/dfu_reboot.h
    -I../firmware_common
    ; Debug/heartbeat serial redirected to the Raspberry-Pi header (PD5/PD6),
    ; separate from the USB-CDC serial used for the actual command interface.
    -DSERIAL_UART_INSTANCE=2
    -DPIN_SERIAL_RX=PD6
    -DPIN_SERIAL_TX=PD5

; REGARDING USB: Type-C (PA11/PA12, USB FS) is what this config targets.

; QUIRK: without this, no data will be received on the serial USB port.
; https://github.com/stm32duino/Arduino_Core_STM32/issues/1193
monitor_dtr = 1
monitor_speed = 115200

; Upload via USB DFU. Easiest: run ../flash_octo.py, which sends the
; firmware's 'B' command to reboot into the DFU bootloader for you. Manual
; fallback (also needed the very first time, before a 'B'-capable firmware
; is on the board): set the J75 BOOT0 jumper, then press reset once.
upload_protocol = dfu

lib_deps =
    teemuatlut/TMCStepper@^0.7.3
    adafruit/Adafruit MMA8451 Library@^1.2.3
    adafruit/Adafruit Unified Sensor@^1.1.14
